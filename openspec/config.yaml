# openspec/config.yaml — user panel, Phase 1 of 2 (frontend mock prototype)
#
# Keep it short: full rules live in AGENTS.md, product.md, and root design.md.
# Facts (versions, routes, specs, commands) live in AGENTS.md, Repository Facts.
# OpenSpec injects `context` into every artifact, `rules` into the matching
# artifact, and `operations` into apply and archive. Keep `context` under 50KB.

schema: spec-driven

context: |
  Language: Persian (fa).
  Write proposal.md and the requirement and scenario prose of specs in plain
  Persian that a non-technical product owner can read. Keep OpenSpec
  structural headings, delta section names, SHALL/MUST, GIVEN/WHEN/THEN,
  code, file paths, and commands in English. Write the change design.md and
  tasks.md in English.

  Project: موشکاف (Moshekaf) user panel (پنل کاربر), the end-user app (chat and Agent builder) of a Persian, right-to-left product. The admin panel is a separate app in a sibling folder and is not changed from here.
  Current phase: Phase 1 of 2. A frontend-only Next.js prototype with local
  mock data. No database, authentication, backend, network request, or
  persistent browser storage until the user explicitly starts Phase 2.
  Stack: Next.js App Router in src/, TypeScript, Tailwind CSS, shadcn/ui with
  RTL, npm.

  Read before writing any artifact:
  - AGENTS.md: implementation rules, the Phase 1 scope lock, and how to talk
    with the user.
  - product.md: approved product context. It is not approval to build every
    planned capability.
  - design.md in the repository root: the shared visual system. A change's
    own design.md is its technical design only.

  The user is not a developer. Ask only product questions, in plain Persian.
  Decide technical details from these references and the existing code.

rules:
  proposal:
    - Cover one bounded change with one purpose. List what is out of scope.
    - Explain in plain Persian why the change is needed and who benefits.
    - Name the affected capabilities and any existing main specs.
    - List unanswered product questions instead of guessing the answers.
  specs:
    - Describe only observable behavior, meaning what the user sees and does. No frameworks, file paths, or component names.
    - Give every requirement at least one scenario. Cover empty, loading, error, and disabled states when they apply.
    - Phase 1 behavior is temporary. Never state that data is saved permanently or secured.
    - For a MODIFIED requirement, copy the complete current requirement with all its scenarios, then edit it.
  design:
    - Write in English. Record every technical choice here, including routes, feature folder, components, data shape, and client state.
    - Reuse shared components and root design.md tokens. Keep route pages thin.
    - Keep mock records in src/features/<feature>/data behind named functions, with stable string ids and ISO date strings. Keep types in src/features/<feature>/types.
    - No backend, network request, authentication, or persistent browser storage in Phase 1.
  tasks:
    - Write in English. Use small checkbox tasks grouped by area, each naming the files it touches.
    - End with verification tasks. Check every scenario in the browser at narrow and wide widths in RTL. Run lint for structural changes and build for configuration or multi-route work.
    - Add a documentation task only when facts in AGENTS.md, design.md, or product.md change.

operations:
  apply:
    guidance:
      - Report progress and any blocking product question in plain Persian.
      - Mark a task [x] only after its work and checks pass. Stop and ask before widening the scope.
  archive:
    guidance:
      - Archive only when no CRITICAL verify finding remains and the user has decided on every WARNING.
      - Sync delta specs into openspec/specs before archiving, then summarize the result in plain Persian.
