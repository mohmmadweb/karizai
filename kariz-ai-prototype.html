<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کاریز | نمونه رابط کاربری با کاریز AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f2f4f8;--card:#fff;--fg:#1c2433;--mut:#6b7385;--bd:#e3e7ef;--soft:#f6f8fb;
 --nav:#16233f;--nav2:#1f2f52;--navfg:#dfe6f5;--navmut:#9aa8c4;
 --pri:#1c3a6e;--pri-soft:#e8eefb;
 --ai:#6b4fd8;--ai2:#9a6bff;--ai-soft:#f1edff;--ai-bd:#d9cffc;
 --ok:#1d9e75;--ok-soft:#e3f5ee;--warn:#ba7517;--warn-soft:#fdf2dd;--bad:#c2412d;--bad-soft:#fbe9e5;
}
[data-theme=dark]{
 --bg:#10151f;--card:#171e2b;--fg:#e7ebf3;--mut:#9aa3b5;--bd:#263045;--soft:#1b2333;
 --nav:#0c1220;--nav2:#16203a;--pri:#8fb0ff;--pri-soft:#1c2a4a;
 --ai:#a58bff;--ai2:#c3a8ff;--ai-soft:#231c40;--ai-bd:#3b2f6b;
 --ok-soft:#12302a;--warn-soft:#3a2c0c;--bad-soft:#3a1a14;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.75 Vazirmatn,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.app{display:flex;height:100vh}
/* sidebar */
.side{width:250px;flex-shrink:0;background:var(--nav);color:var(--navfg);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:700;font-size:20px;letter-spacing:.3px}
.brand .lg{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3a6fd8,#6b4fd8);display:grid;place-items:center}
.sec{padding:6px 10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--navmut);padding:8px 10px 4px;cursor:pointer;user-select:none}
.sec-h.aih{color:#c9b8ff}
.nv{display:flex;align-items:center;gap:10px;padding:7px 12px;margin:1px 0;border-radius:9px;font-size:13.5px;color:var(--navfg);cursor:pointer}
.nv:hover{background:var(--nav2)}
.nv.on{background:#e8eefb;color:#16233f;font-weight:700}
.nv svg{width:17px;height:17px;flex-shrink:0}
.nv .tag{margin-right:auto;font-size:10.5px;background:#6b4fd8;color:#fff;border-radius:6px;padding:0 6px}
.nv.ai-item svg{color:#c9b8ff}.nv.on.ai-item svg{color:#6b4fd8}
.side-foot{margin-top:auto;padding:12px 18px;font-size:11.5px;color:var(--navmut)}
/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:62px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0}
.me{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:4px 6px 4px 10px}
.search input{flex:1;border:0;background:transparent;outline:0;padding:4px}
.search .mode{font-size:12px;border-radius:8px;padding:3px 10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;white-space:nowrap}
.search .mode.ai{background:var(--ai);color:#fff;border-color:var(--ai)}
.kbd{font-size:11px;color:var(--mut);border:1px solid var(--bd);border-radius:5px;padding:0 5px}
.tb{display:flex;align-items:center;gap:8px;margin-right:auto}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}
.ibtn svg{width:18px;height:18px}
.badge{position:absolute;top:-5px;left:-5px;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;line-height:16px}
.org{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:6px 10px;background:var(--card);font-size:13px;cursor:pointer;position:relative}
.dd{position:absolute;top:44px;left:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:230px;z-index:50;padding:6px;display:none}
.dd.open{display:block}
.dd .di{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.dd .di:hover{background:var(--soft)}
.hl-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap}
.sw{width:34px;height:20px;border-radius:12px;background:var(--bd);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ai)}.sw.on:after{right:16px}
.view{flex:1;overflow-y:auto;padding:20px 22px 90px}
/* common */
h1{font-size:20px;margin:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph p{margin:2px 0 0;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.ct{font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ct small{font-weight:400;color:var(--mut);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:7px 14px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
[data-theme=dark] .btn.pri{color:#0c1220}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn svg{width:15px;height:15px}
.ai-btn{background:var(--ai-soft);color:var(--ai);border:1px solid var(--ai-bd)}
.ai-btn:hover{background:var(--ai);color:#fff}
.ai-btn.solid{background:linear-gradient(135deg,var(--ai),var(--ai2));color:#fff;border:0}
.spark{display:inline-block;color:var(--ai);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid var(--bd);background:var(--soft);white-space:nowrap}
.chip.ai{background:var(--ai-soft);color:var(--ai);border-color:var(--ai-bd)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.loc{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ext{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{margin-right:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--pri);color:#fff;font-weight:500;text-align:right;padding:9px 10px}
[data-theme=dark] th{color:#0c1220}
td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:var(--soft)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.ai-card{background:var(--ai-soft);border:1px solid var(--ai-bd);border-radius:14px;padding:14px 16px}
.ai-card .ct{color:var(--ai)}
.li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
[data-theme=dark] .tab.on{color:#0c1220}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar.ai>i{background:linear-gradient(90deg,var(--ai),var(--ai2))}
/* AI highlight mode */
body.hl .ai-el{outline:2px dashed var(--ai);outline-offset:3px;border-radius:12px;position:relative}
body.hl .ai-el:before{content:"✦ کاریز AI";position:absolute;top:-11px;left:10px;background:var(--ai);color:#fff;font-size:10px;padding:0 6px;border-radius:6px;line-height:16px;z-index:2}
/* AI floating + panel */
.fab{position:fixed;left:22px;bottom:22px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--ai),var(--ai2));color:#fff;display:grid;place-items:center;box-shadow:0 10px 28px rgba(107,79,216,.45);cursor:pointer;z-index:60;border:0}
.fab svg{width:26px;height:26px}
.panel{position:fixed;top:0;left:0;height:100vh;width:420px;max-width:100vw;background:var(--card);border-right:1px solid var(--bd);box-shadow:8px 0 30px rgba(0,0,0,.12);z-index:70;display:flex;flex-direction:column;transform:translateX(-105%);transition:.25s}
.panel.open{transform:none}
.pn-h{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.pn-h b{font-size:15px}
.ctx{margin:10px 16px 0;font-size:12px;background:var(--ai-soft);color:var(--ai);border-radius:10px;padding:6px 10px}
.pn-b{flex:1;overflow-y:auto;padding:12px 16px}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.msg{margin:8px 0;padding:10px 12px;border-radius:12px;font-size:13.5px;max-width:92%}
.msg.u{background:var(--pri-soft);margin-right:auto}
.msg.a{background:var(--soft);border:1px solid var(--bd)}
.msg.a .who{font-size:11.5px;color:var(--ai);font-weight:700;margin-bottom:4px}
.src{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.src span{font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:0 6px;background:var(--card)}
.compose{border-top:1px solid var(--bd);padding:10px 12px}
.cbox{border:1px solid var(--bd);border-radius:12px;padding:8px;background:var(--soft)}
.cbox textarea{width:100%;border:0;background:transparent;resize:none;outline:0;min-height:44px}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ai);margin:0 2px;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
/* modal */
.mask{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.mask.open{display:flex}
.modal{background:var(--card);border-radius:16px;width:640px;max-width:100%;max-height:90vh;overflow-y:auto;padding:18px 20px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.inp{width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--soft)}
/* chat page */
.chatwrap{display:grid;grid-template-columns:280px 1fr;gap:14px;height:calc(100vh - 150px)}
.clist{overflow-y:auto}
.citem{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;align-items:center}
.citem:hover,.citem.on{background:var(--soft)}
.cpane{display:flex;flex-direction:column;min-height:0}
.cmsgs{flex:1;overflow-y:auto;padding:6px 4px}
.bub{max-width:75%;padding:9px 12px;border-radius:12px;margin:6px 0;font-size:13.5px}
.bub.in{background:var(--soft);border:1px solid var(--bd)}
.bub.out{background:var(--pri-soft);margin-right:auto}
.bub.bot{background:var(--ai-soft);border:1px solid var(--ai-bd)}
.bub .t{font-size:11px;color:var(--mut);margin-top:3px}
/* assistant */
.starter{cursor:pointer}
.starter:hover{border-color:var(--ai-bd);background:var(--ai-soft)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:12.5px;background:var(--soft)}
.step.ap{border-color:var(--warn);background:var(--warn-soft)}
.step.ag{border-color:var(--ai-bd);background:var(--ai-soft)}
.arw{color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0}
.bars div{flex:1;background:linear-gradient(180deg,var(--ai2),var(--ai));border-radius:6px 6px 0 0;position:relative}
.bars div span{position:absolute;bottom:-20px;right:0;left:0;text-align:center;font-size:11px;color:var(--mut)}
.code{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:10px;white-space:pre-wrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.cal div{min-height:86px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:6px;font-size:12px}
.cal .hd{min-height:0;background:var(--pri);color:#fff;text-align:center;font-weight:500}
[data-theme=dark] .cal .hd{color:#0c1220}
.ev{display:block;font-size:11px;border-radius:6px;padding:1px 6px;margin-top:4px;background:var(--pri-soft);cursor:pointer}
.ev.ai{background:var(--ai-soft);color:var(--ai)}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--fg);color:var(--card);padding:9px 16px;border-radius:12px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:900px){.side{position:fixed;right:-260px;z-index:75;height:100vh;transition:.2s}.side.open{right:0}.chatwrap{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"></aside>
<div class="main">
<header class="top">
 <button class="ibtn" id="menuBtn" style="display:none" aria-label="منو"></button>
 <div class="me"><div class="av" style="background:#2f6fd0">م</div><span class="hide-m">مریم احمدی</span><span class="mut sm hide-m">مسئول کیفیت</span></div>
 <div class="search ai-el" id="searchBox">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="searchInp" placeholder="جستجو در کاریز…">
  <span class="kbd hide-m">Ctrl K</span>
  <button class="mode" id="modeKw">جستجو</button>
  <button class="mode ai" id="modeAi">✦ پرسش از AI</button>
 </div>
 <div class="tb">
  <div class="hl-toggle" id="hlToggle" title="نمایش بخش‌هایی که کاریز AI اضافه کرده"><div class="sw" id="hlSw"></div><span class="hide-m">نمایش لایه AI</span></div>
  <div class="org" id="orgBtn">🏭 <span id="orgName">پارسا پلیمر شریف</span> ▾
   <div class="dd" id="orgDd"><div class="mut sm" style="padding:4px 10px">تغییر سازمان</div><div class="di" data-org="پارسا پلیمر شریف">✓ پارسا پلیمر شریف</div><div class="di" data-org="هلدینگ صنایع شیمیایی">هلدینگ صنایع شیمیایی</div></div>
  </div>
  <button class="ibtn" id="bellBtn" aria-label="اعلان‌ها">🔔<span class="badge">۵</span>
   <div class="dd" id="bellDd" style="width:330px;text-align:right"></div>
  </button>
  <button class="ibtn" id="themeBtn" aria-label="تغییر حالت">◐</button>
 </div>
</header>
<main class="view" id="view"></main>
</div>
</div>

<button class="fab ai-el" id="fab" title="دستیار کاریز AI"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6zM19 14l.9 2.6L22 17.5l-2.1.9L19 21l-.9-2.6L16 17.5l2.1-.9zM5 15l.7 1.8L7.5 17.5l-1.8.7L5 20l-.7-1.8L2.5 17.5l1.8-.7z"/></svg></button>

<aside class="panel" id="panel">
 <div class="pn-h"><span class="spark" style="font-size:20px">✦</span><b>دستیار کاریز AI</b><span class="chip loc">مدل داخلی</span><button class="btn sm sp" id="pClose">بستن ✕</button></div>
 <div class="ctx" id="pCtx">زمینه: میز کار من</div>
 <div class="pn-b" id="pBody"></div>
 <div class="compose"><div class="cbox"><textarea id="pInp" placeholder="بپرسید یا @ برای انتخاب عامل…"></textarea><div class="row"><span class="chip">📎 پیوست</span><span class="chip" id="pAgent">@ عامل: خودکار</span><span class="sp"></span><button class="btn sm ai-btn solid" id="pSend">ارسال</button></div></div>
 <div class="mut" style="font-size:11px;margin-top:6px">پاسخ‌ها فقط از اطلاعاتی ساخته می‌شوند که شما به آن‌ها دسترسی دارید.</div></div>
</aside>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- icons ---------- */
const I={
home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
spark:'<path d="M12 3l1.6 4.8L18.5 9l-4.9 1.4L12 15l-1.6-4.6L5.5 9l4.9-1.2z"/><path d="M18 15l.8 2.2 2.2.8-2.2.8L18 21l-.8-2.2-2.2-.8 2.2-.8z"/>',
bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9 17h6"/>',
store:'<path d="M4 9h16l-1 11H5z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/>',
flow:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/>',
book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-4a2 2 0 0 0-2 2"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
plug:'<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
gauge:'<path d="M12 14l4-4"/><path d="M3 14a9 9 0 0 1 18 0"/>',
users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15 15a5 5 0 0 1 6 5"/>',
chat:'<path d="M4 5h16v11H8l-4 4z"/>',
group:'<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20a6 6 0 0 1 12 0M10 20a6 6 0 0 1 12 0"/>',
mega:'<path d="M3 11v2l13 5V6z"/><path d="M16 9a3 3 0 0 1 0 6M6 14l1 5h3l-1-4"/>',
news:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>',
brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5h8v2"/>',
check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/>',
shield:'<path d="M12 3 4 6v6c0 5 4 8 8 9 4-1 8-4 8-9V6z"/>'
};
function ic(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg>';}

/* ---------- nav ---------- */

 if(adminTab===3)body=`<div class="tw"><table><tr><th>زمان</th><th>کاربر</th><th>عامل</th><th>ابزار / منبع</th><th>مدل</th><th>نتیجه</th></tr>${[['۰۹:۱۶','مریم احمدی','دستیار کیفیت','LIMS: بچ ۲۱۲','Qwen داخلی','موفق'],['۰۸:۳۰','جریان سفارش مواد','عامل پیش‌بینی','SQL تدارک (فقط‌خواندنی)','Qwen داخلی','منتظر تأیید'],['۰۸:۰۵','نرگس حسینی','دستیار فروش','نرخ ارز','DeepSeek (پوشانده)','موفق'],['دیروز','رضا محمدی','دستیار نگهداری','CMMS','Qwen داخلی','دسترسی رد شد: خارج از واحد']].map(a=>`<tr>${a.map((x,i)=>`<td class="${i?'':'sm'}">${i===5?`<span class="chip ${x==='موفق'?'ok':x.startsWith('دسترسی')?'bad':'warn'}">${x}</span>`:x}</td>`).join('')}</tr>`).join('')}</table></div>`;
 if(adminTab===4)body=`<div class="tw"><table><tr><th>نوع داده</th><th>نمونه</th><th>اقدام پیش از مدل بیرونی</th></tr>${[['کد ملی','۰۰۱۲۳۴۵۶۷۸','جایگزینی با [کد_ملی_۱]'],['شماره شبا','IR06…','جایگزینی'],['فرمول کامپاند','PP 72% · Talc 20%…','ممنوع: فقط مدل داخلی'],['نام مشتری','شرکت نمونه','جایگزینی با نام مستعار'],['قیمت فروش','۱۲۰٬۰۰۰ تومان/kg','فقط مدل داخلی']].map(r=>`<tr><td>${r[0]}</td><td class="sm" style="direction:ltr;text-align:right">${r[1]}</td><td><span class="chip ${r[2].startsWith('ممنوع')||r[2].startsWith('فقط')?'bad':'ok'}">${r[2]}</span></td></tr>`).join('')}</table></div>`;
 if(adminTab===5)body=`<div class="tw"><table><tr><th>عامل</th><th>نسخه</th><th>مجموعه ارزیابی</th><th>دقت</th><th>تغییر</th></tr>${AGENTS.map((a,i)=>`<tr><td>${a.n}</td><td>${a.v}</td><td class="sm">${12+i*3} نمونه</td><td><span class="chip ok">${a.ev}</span></td><td class="sm">${i%2?'+۲٪':'بدون تغییر'}</td></tr>`).join('')}</table></div><p class="sm mut">پیش از انتشار هر نسخه یا تغییر مدل، ارزیابی خودکار اجرا می‌شود؛ افت دقت مانع انتشار است.</p>`;
 return `<div class="ph"><div><h1>مدیریت هوش مصنوعی</h1><p>سیاست‌ها، بودجه‌ها، تأییدها و ممیزی در سطح سازمان</p></div><span class="chip loc">🔒 همه مدل‌های داخلی روی سرورهای سازمان</span></div>
 <div class="tabs">${tabs.map((t,i)=>`<span class="tab${i===adminTab?' on':''}" onclick="adminTab=${i};render()">${t}</span>`).join('')}</div><div class="ai-el">${body}</div>`;};

/* ---------- router ---------- */
let cur='dash';
function render(){cur=(location.hash||'#dash').slice(1);if(!PAGES[cur])cur='dash';renderNav(cur);document.getElementById('view').innerHTML=PAGES[cur]();document.getElementById('view').scrollTop=0;if(window.innerWidth<900)document.getElementById('side').classList.remove('open');}
window.addEventListener('hashchange',render);

/* ---------- top bar ---------- */
document.getElementById('hlToggle').onclick=()=>{document.body.classList.toggle('hl');document.getElementById('hlSw').classList.toggle('on');};
document.getElementById('themeBtn').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'':'dark';};
const orgBtn=document.getElementById('orgBtn'),orgDd=document.getElementById('orgDd');
orgBtn.onclick=e=>{e.stopPropagation();orgDd.classList.toggle('open');};
orgDd.querySelectorAll('[data-org]').forEach(d=>d.onclick=e=>{e.stopPropagation();document.getElementById('orgName').textContent=d.dataset.org;orgDd.classList.remove('open');toast('سازمان تغییر کرد؛ عامل‌ها، دانش و سهمیه‌ها مخصوص همین سازمان‌اند');});
const bellBtn=document.getElementById('bellBtn'),bellDd=document.getElementById('bellDd');
bellDd.innerHTML='<div class="mut sm" style="padding:4px 10px">اعلان‌ها</div>'+[['✦','جریان سفارش مواد منتظر تأیید شماست'],['✦','تحلیل بچ ۲۱۲ آماده است'],['💬','علی رضایی در گروه کیفیت شما را نام برد'],['📅','جلسه بازبینی کیفیت ۱۰:۳۰'],['✦','صورت‌جلسه «جلسه تأمین» آماده شد']].map(n=>'<div class="di"><span class="'+(n[0]==='✦'?'spark':'')+'">'+n[0]+'</span> '+n[1]+'</div>').join('');
bellBtn.onclick=e=>{e.stopPropagation();bellDd.classList.toggle('open');};
document.addEventListener('click',()=>{orgDd.classList.remove('open');bellDd.classList.remove('open');});
const modeKw=document.getElementById('modeKw'),modeAi=document.getElementById('modeAi'),sInp=document.getElementById('searchInp');
modeKw.onclick=()=>{modeKw.classList.add('ai');modeAi.classList.remove('ai');sInp.placeholder='جستجو در کاریز…';};
modeAi.onclick=()=>{modeAi.classList.add('ai');modeKw.classList.remove('ai');sInp.placeholder='از کاریز بپرسید: «آخرین تصمیم درباره مستربچ مشکی چه بود؟»';sInp.focus();};
sInp.addEventListener('keydown',e=>{if(e.key==='Enter'&&sInp.value.trim()){if(modeAi.classList.contains('ai')){openPanel('جستجوی سراسری');ask(sInp.value.trim());}else toast('نتایج جستجو');sInp.value='';}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modeAi.click();}});
const mb=document.getElementById('menuBtn');if(window.innerWidth<900){mb.style.display='grid';mb.textContent='☰';mb.onclick=()=>document.getElementById('side').classList.toggle('open');}
render();
</script>
</body>
</html>
